---
- name: Configurar Barrio Vivo en Ubuntu 24.04
  hosts: barrio_vivo
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Instalar Docker, Git, escritorio y herramientas de firewall
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - docker.io
          - docker-compose-v2
          - git
          - iptables
          - iptables-persistent
          - xfce4
          - dbus-x11
          - tigervnc-standalone-server
        state: present

    - name: Habilitar Docker al iniciar
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Agregar usuario Ubuntu al grupo Docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Crear directorio VNC
      ansible.builtin.file:
        path: /home/ubuntu/.vnc
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Instalar script de inicio de escritorio VNC
      ansible.builtin.copy:
        dest: /home/ubuntu/.vnc/xstartup
        owner: ubuntu
        group: ubuntu
        mode: "0755"
        content: "#!/bin/sh\nstartxfce4 &\n"

    - name: Validar que se definió la contraseña VNC
      ansible.builtin.assert:
        that: vnc_password | length >= 8
        fail_msg: Define VNC_PASSWORD con al menos 8 caracteres antes de ejecutar Ansible.
      no_log: true

    - name: Crear contraseña VNC cifrada
      ansible.builtin.shell: "printf '%s\\n' {{ vnc_password | quote }} | vncpasswd -f > /home/ubuntu/.vnc/passwd"
      args:
        creates: /home/ubuntu/.vnc/passwd
      become_user: ubuntu
      no_log: true

    - name: Asegurar permisos de la contraseña VNC
      ansible.builtin.file:
        path: /home/ubuntu/.vnc/passwd
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Crear servicio VNC para el escritorio XFCE
      ansible.builtin.copy:
        dest: /etc/systemd/system/vncserver.service
        mode: "0644"
        content: |
          [Unit]
          Description=TigerVNC virtual desktop
          After=network.target
          [Service]
          Type=forking
          User=ubuntu
          WorkingDirectory=/home/ubuntu
          PIDFile=/home/ubuntu/.vnc/%H:1.pid
          ExecStart=/usr/bin/tigervncserver :1 -localhost no -geometry 1440x900 -depth 24
          ExecStop=/usr/bin/tigervncserver -kill :1
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      notify: Reiniciar VNC

    - name: Aplicar reglas iptables persistentes para SSH, VNC, HTTP y HTTPS
      ansible.builtin.copy:
        dest: /etc/iptables/rules.v4
        mode: "0600"
        content: |
          *filter
          :INPUT DROP [0:0]
          :FORWARD DROP [0:0]
          :OUTPUT ACCEPT [0:0]
          -A INPUT -i lo -j ACCEPT
          -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          -A INPUT -p tcp --dport 22 -s {{ admin_cidr }} -j ACCEPT
          -A INPUT -p tcp --dport 5901 -s {{ admin_cidr }} -j ACCEPT
          -A INPUT -p tcp --dport 80 -j ACCEPT
          -A INPUT -p tcp --dport 443 -j ACCEPT
          -A INPUT -p icmp -j ACCEPT
          COMMIT
      notify: Cargar firewall

    - name: Habilitar servicios al inicio
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - netfilter-persistent
        - vncserver

  handlers:
    - name: Cargar firewall
      ansible.builtin.command: netfilter-persistent reload
      changed_when: true
    - name: Reiniciar VNC
      ansible.builtin.systemd:
        name: vncserver
        enabled: true
        state: restarted
        daemon_reload: true
