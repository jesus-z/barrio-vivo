name: Barrio Vivo CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas unitarias, integración y E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barriovivo
          POSTGRES_USER: barrio
          POSTGRES_PASSWORD: barrio_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U barrio -d barriovivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://barrio:barrio_test@localhost:5432/barriovivo?schema=public
      API_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validar infraestructura OCI
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  publish:
    name: Crear y publicar imágenes Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar emulación ARM para Ampere A1
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barrio-vivo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/barrio-vivo-api:${{ github.sha }}
      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barrio-vivo-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/barrio-vivo-web:${{ github.sha }}
